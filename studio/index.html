<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Content studio / Alex Stopa</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f1eb;color:#20211f;font:14px Arial}header{padding:20px 25px;border-bottom:1px solid #ccc;display:flex;justify-content:space-between;align-items:center}h1{font-size:22px;margin:0}header p,small{color:#666}button{padding:10px 15px;background:#20211f;color:white;border:0;cursor:pointer;border-radius:5px}main{display:grid;grid-template-columns:160px 1fr 1fr;height:calc(100vh - 105px)}nav{padding:20px 10px;overflow:auto;border-right:1px solid #ccc}nav button{display:block;background:none;color:#20211f;text-transform:capitalize;width:100%;text-align:left;margin-bottom:5px}nav button.active{background:#deddd5}section{padding:25px;overflow:auto}label{display:block;font-weight:bold;margin:20px 0 8px;font-size:12px;text-transform:capitalize}input,textarea{width:100%;padding:10px;border:1px solid #bbb;background:white;font:14px Arial;line-height:1.5}textarea{min-height:100px;resize:vertical}fieldset{border:1px solid #ccc;margin:20px 0}legend{font-weight:bold}fieldset button{margin:10px 10px 10px 0}iframe{width:100%;height:100%;border:0}#status{margin-right:15px;font-size:12px}#error{color:#ad2d15}h2{text-transform:capitalize}#raw{min-height:300px;font-family:monospace}details{margin-top:30px}@media(max-width:1000px){main{grid-template-columns:130px 1fr}iframe{display:none}}</style></head><body><header><div><h1>alex stopa / content studio</h1><p>Local files. Live preview. Git history.</p></div><div><span id="status" role="status">Loading…</span><button id="save">Save content</button></div></header><main><nav id="nav"></nav><section><h2 id="title"></h2><small>Save writes content/site.json. Vite updates the preview. Review, commit, and push using Git when ready.</small><p id="error" role="alert"></p><div id="fields"></div><details><summary>Advanced JSON editor</summary><textarea id="raw" aria-label="All content JSON"></textarea><button id="apply">Apply JSON to form</button></details></section><iframe src="http://127.0.0.1:5173" title="Live website preview"></iframe></main><script>
const token='__TOKEN__',$=id=>document.getElementById(id);let data,active='hero',dirty=false;const label=s=>String(s).replace(/([A-Z])/g,' $1');function changed(){dirty=true;$('status').textContent='Unsaved changes';$('raw').value=JSON.stringify(data,null,2)}function field(value,parent,key,path){if(typeof value==='string'){const box=document.createElement('div'),l=document.createElement('label'),i=document.createElement(value.length>90||value.includes('\n')?'textarea':'input');i.id='f-'+path.join('-');i.value=value;l.htmlFor=i.id;l.textContent=label(key);i.oninput=()=>{parent[key]=i.value;changed()};box.append(l,i);return box}const group=document.createElement('fieldset'),legend=document.createElement('legend');legend.textContent=label(key);group.append(legend);Object.keys(value).forEach(k=>group.append(field(value[k],value,k,[...path,k])));if(Array.isArray(value)){const add=document.createElement('button');add.textContent='Add entry';add.onclick=()=>{value.push(structuredClone(value.at(-1)));changed();render()};group.append(add);if(value.length>1){const remove=document.createElement('button');remove.textContent='Remove last entry';remove.onclick=()=>{value.pop();changed();render()};group.append(remove)}}return group}function render(){$('title').textContent=label(active);$('fields').replaceChildren(field(data[active],data,active,[active]));$('raw').value=JSON.stringify(data,null,2);$('nav').replaceChildren(...Object.keys(data).map(k=>{const b=document.createElement('button');b.textContent=label(k);b.className=k===active?'active':'';b.onclick=()=>{active=k;render()};return b}))}$('save').onclick=async()=>{$('save').disabled=true;try{const r=await fetch('/api/content',{method:'PUT',headers:{'Content-Type':'application/json','X-Studio-Token':token},body:JSON.stringify(data)}),result=await r.json();if(!r.ok)throw Error(result.error);dirty=false;$('status').textContent='Saved ✓';$('error').textContent=''}catch(e){$('error').textContent=e.message;$('status').textContent='Save failed'}finally{$('save').disabled=false}};$('apply').onclick=()=>{try{const next=JSON.parse($('raw').value);if(!next[active])throw Error('Keep the existing sections');data=next;changed();render()}catch(e){$('error').textContent=e.message}};addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});fetch('/api/content').then(r=>r.json()).then(v=>{data=v;render();$('status').textContent='Ready'}).catch(e=>$('error').textContent=e.message);
</script></body></html>
